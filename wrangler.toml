name = "social-music-backend"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "cache_option_enabled"]

[vars]
DEFAULT_NERI_SERVER = "https://neriplayer.hancat.work"

# ============================================================
# 房间实时中枢
#
# 全站同时只允许一个房间在放歌（/api/room/host/start 会以 409 拒绝第二个），
# 因此用一个固定名字的 DO 实例承载「当前房间 + 在线成员」，由它直接持有
# WebSocket 连接并广播，取代原先客户端 6~10 秒一轮的轮询。
# ============================================================
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

# ============================================================
# 用户 / 房间历史
#
# 2026-09 从 MongoDB 迁到 D1。原因是 Cloudflare 按「请求」划分 I/O 上下文，
# MongoClient 不能跨请求复用，于是每个请求都要重建连接 —— 实测一次 2~4 秒，
# 登录、成员列表、开房全都被拖慢。D1 走 binding、没有连接概念，单次查询 1~5ms。
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "social-music-db"
database_id = "8a3817fe-5fb2-40fc-b37e-274a49ebf647"
